<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Notepad</title>
<meta name="description" content="A browser notepad that autosaves your text and flags duplicate pastes.">
<style>
:root {
  color-scheme: light dark;
  --page: #f5f6f8;
  --panel: #fff;
  --ink: #191c23;
  --muted: #5e6675;
  --line: #dce0e7;
  --accent: #2459cf;
  --button-text: white;
  --warning: #9b432b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #17191e;
    --panel: #202329;
    --ink: #f1f3f8;
    --muted: #adb5c4;
    --line: #383e49;
    --accent: #9cb9ff;
    --button-text: #13254e;
    --warning: #ffc0a9;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 system-ui, sans-serif; }
main { width: min(100% - 32px, 960px); margin: clamp(24px, 7vh, 72px) auto; }
h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.05; letter-spacing: -.055em; margin: 0 0 12px; }
p { margin: 0 0 20px; color: var(--muted); }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
label, footer { display: block; padding: 10px 16px; font-size: 13px; }
label { font-weight: 650; border-bottom: 1px solid var(--line); }
textarea {
  display: block;
  width: 100%;
  height: 28vh;
  min-height: 220px;
  padding: 16px;
  border: 0;
  resize: vertical;
  background: var(--panel);
  color: var(--ink);
  font: 14px/1.65 ui-monospace, Menlo, Consolas, monospace;
}
textarea::placeholder { color: var(--muted); }
footer { border-top: 1px solid var(--line); color: var(--muted); }
footer[data-error] { color: var(--warning); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
textarea:focus-visible { outline-offset: -3px; }
dialog {
  width: min(100% - 32px, 530px);
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 20px 80px #0004;
}
dialog::backdrop { background: #151a2580; }
h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.03em; }
#matches { max-height: 32vh; overflow: auto; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.primary { background: var(--accent); color: var(--button-text); border-color: var(--accent); font-weight: 650; }
form { margin: 0; }
.composer-actions { padding: 12px 16px; border-top: 1px solid var(--line); }
.saved { margin-top: 28px; }
.entry { margin-top: 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
h3 { margin: 0 0 6px; font-size: 13px; }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.55 ui-monospace, Menlo, Consolas, monospace; }
#matches { margin-bottom: 16px; }
#matches .entry { margin-top: 8px; }
input[type="text"] { width: 100%; padding: 10px 16px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
.composer-title { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.composer-title label, #rename label { border: 0; padding: 0 0 6px; }
.entry-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; overflow-wrap: anywhere; }
#rename .actions { margin-top: 16px; }
.entry-actions { display: flex; flex-wrap: wrap; gap: 6px; }
#composer { scroll-margin-top: 16px; }
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0BYFQWWJY9"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-0BYFQWWJY9', {
    page_location: 'https://zegulas.github.io/text-notepad/',
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
</head>
<body>
<main>
  <h1>Text Notepad</h1>
  <p>Save separate text entries in this browser. Duplicate checks ignore spaces, tabs, and line breaks.</p>
  <form id="composer" class="editor">
    <div class="composer-title">
      <label for="entry-title">Title (optional)</label>
      <input type="text" id="entry-title" maxlength="120" placeholder="Give this entry a name">
    </div>
    <label id="note-label" for="note">New entry</label>
    <textarea id="note" spellcheck="false" placeholder="Paste or type text here…" required></textarea>
    <div class="composer-actions"><button id="submit-entry" class="primary">Add entry</button>
      <button type="button" id="cancel-edit" hidden>Cancel edit</button></div>
    <footer id="status" role="status"></footer>
  </form>
  <section class="saved" aria-labelledby="saved-title">
    <h2 id="saved-title">Saved entries</h2>
    <p id="empty">No entries yet.</p>
    <div id="entries"></div>
  </section>
</main>
<dialog id="duplicate" aria-labelledby="duplicate-title" aria-describedby="explanation">
  <h2 id="duplicate-title">Matching entries found</h2>
  <p id="explanation">These entries match your new text when whitespace is ignored.</p>
  <div id="matches"></div>
  <div class="actions">
    <button type="button" id="discard" autofocus>Discard new</button>
    <button type="button" id="replace">Keep new only</button>
    <button type="button" id="keep" class="primary">Keep all</button>
  </div>
</dialog>
<dialog id="rename" aria-labelledby="rename-heading">
  <form id="rename-form">
    <h2 id="rename-heading">Rename entry</h2>
    <label for="rename-title">Title (optional)</label>
    <input type="text" id="rename-title" maxlength="120" autofocus>
    <p id="rename-error" role="status"></p>
    <div class="actions">
      <button type="button" id="rename-cancel">Cancel</button>
      <button class="primary">Save title</button>
    </div>
  </form>
</dialog>
<script>
'use strict';

const legacyKey = 'zegulas.text-notepad.note.v1';
const storageKey = 'zegulas.text-notepad.entries.v1';
const note = document.getElementById('note');
const status = document.getElementById('status');
const dialog = document.getElementById('duplicate');
const entryTitle = document.getElementById('entry-title');
const renameDialog = document.getElementById('rename');
const renameTitle = document.getElementById('rename-title');
const renameError = document.getElementById('rename-error');
const composer = document.getElementById('composer');
const submitEntry = document.getElementById('submit-entry');
const cancelEdit = document.getElementById('cancel-edit');
const noteLabel = document.getElementById('note-label');
let editingEntry;
let editingId;
let pending;

function comparisonText(text) {
  return text.replace(/\s/g, '');
}

function readEntries() {
  const saved = localStorage.getItem(storageKey);
  if (saved !== null) return JSON.parse(saved);
  const legacy = localStorage.getItem(legacyKey);
  return legacy ? [{id: 1, text: legacy}] : [];
}

function report(message, error = false) {
  status.textContent = message;
  status.toggleAttribute('data-error', error);
}

function entryCard(entry, preview = false) {
  const card = document.createElement('article');
  card.className = 'entry';
  const title = document.createElement('h3');
  title.textContent = entry.title || 'Entry ' + entry.id;
  const header = document.createElement('div');
  header.className = 'entry-header';
  header.append(title);
  if (!preview) {
    const rename = document.createElement('button');
    rename.type = 'button';
    rename.textContent = 'Rename';
    rename.setAttribute('aria-label', 'Rename ' + title.textContent);
    rename.addEventListener('click', () => {
      editingId = entry.id;
      renameTitle.value = entry.title || '';
      renameError.textContent = '';
      renameDialog.showModal();
    });
    rename.className = 'rename-entry';
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.textContent = 'Edit';
    edit.setAttribute('aria-label', 'Edit ' + title.textContent);
    edit.addEventListener('click', () => beginEdit(entry));
    const actions = document.createElement('div');
    actions.className = 'entry-actions';
    actions.append(edit, rename);
    header.append(actions);
  }
  const content = document.createElement('pre');
  content.textContent = preview && entry.text.length > 400 ? entry.text.slice(0, 400) + '…' : entry.text;
  card.append(header, content);
  return card;
}

function render(entries) {
  const list = document.getElementById('entries');
  const cards = document.createDocumentFragment();
  for (const entry of [...entries].reverse()) cards.append(entryCard(entry));
  list.replaceChildren(cards);
  document.getElementById('empty').hidden = entries.length > 0;
}

function refresh() {
  try {
    render(readEntries());
    report('Entries are stored in this browser.');
  } catch {
    report('Saved entries are unavailable in this browser.', true);
  }
}

function beginEdit(entry) {
  if (editingEntry?.id === entry.id) {
    note.focus();
    return;
  }
  const hasDraft = note.value !== (editingEntry?.text ?? '') ||
    entryTitle.value !== (editingEntry?.title ?? '');
  if (hasDraft && !window.confirm('Discard the unsaved text in the editor?')) return;

  editingEntry = entry;
  note.value = entry.text;
  entryTitle.value = entry.title ?? '';
  noteLabel.textContent = 'Edit entry';
  submitEntry.textContent = 'Save changes';
  cancelEdit.hidden = false;
  note.focus({preventScroll: true});
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  composer.scrollIntoView({block: 'start', behavior: reducedMotion ? 'instant' : 'smooth'});
  report('Editing ' + (entry.title || 'Entry ' + entry.id) + '.');
}

function clearDraft(message) {
  editingEntry = undefined;
  noteLabel.textContent = 'New entry';
  submitEntry.textContent = 'Add entry';
  cancelEdit.hidden = true;
  note.value = '';
  entryTitle.value = '';
  note.focus();
  report(message);
}

function save(entries, text, title, replaceIds = new Set()) {
  const nextId = entries.reduce((max, entry) => Math.max(max, entry.id), 0) + 1;
  const next = entries.filter(entry => !replaceIds.has(entry.id));
  if (editingEntry) {
    const index = next.findIndex(entry => entry.id === editingEntry.id);
    next[index] = {...next[index], text, title};
  } else {
    next.push({id: nextId, text, title});
  }
  try {
    localStorage.setItem(storageKey, JSON.stringify(next));
  } catch {
    report('Could not save the entry. Your text is still in the input.', true);
    return;
  }
  render(next);
  clearDraft(editingEntry ? 'Changes saved.' : 'Entry ' + nextId + ' saved.');
}

cancelEdit.addEventListener('click', () => clearDraft('Edit canceled.'));
composer.addEventListener('submit', event => {
  event.preventDefault();
  const text = note.value;
  const title = entryTitle.value.trim();
  const key = comparisonText(text);
  if (!key) {
    report('Enter some text before saving the entry.', true);
    return;
  }

  try {
    const entries = readEntries();
    if (editingEntry) {
      const current = entries.find(entry => entry.id === editingEntry.id);
      if (!current || current.text !== editingEntry.text || current.title !== editingEntry.title) {
        report('The saved entry changed. Copy your draft before reopening the entry.', true);
        return;
      }
    }
    const matches = entries.filter(entry => entry.id !== editingEntry?.id && comparisonText(entry.text) === key);
    if (!matches.length) {
      save(entries, text, title);
      return;
    }
    pending = {text, title, entries, matches};
    document.getElementById('explanation').textContent = editingEntry
      ? 'Other entries match your edited text when whitespace is ignored.'
      : 'These entries match your new text when whitespace is ignored.';
    document.getElementById('discard').textContent = editingEntry ? 'Discard changes' : 'Discard new';
    document.getElementById('replace').textContent = editingEntry ? 'Keep edited entry only' : 'Keep new only';
    const previews = document.createDocumentFragment();
    for (const match of matches) previews.append(entryCard(match, true));
    document.getElementById('matches').replaceChildren(previews);
    dialog.showModal();
  } catch {
    report('Could not read your saved entries. Your text is still in the input.', true);
  }
});

function resolveMatch(choice) {
  const {text, title, entries, matches} = pending;
  pending = undefined;
  dialog.close();
  if (choice === 'discard') {
    clearDraft(editingEntry ? 'Changes discarded.' : 'New entry discarded.');
    return;
  }
  try {
    if (JSON.stringify(readEntries()) !== JSON.stringify(entries)) {
      refresh();
      report('Saved entries changed in another tab. Submit again to check for matches.', true);
      return;
    }
    const replaceIds = new Set(choice === 'replace' ? matches.map(entry => entry.id) : []);
    save(entries, text, title, replaceIds);
  } catch {
    report('Could not read your saved entries. Your text is still in the input.', true);
  }
}

for (const choice of ['discard', 'replace', 'keep']) {
  document.getElementById(choice).addEventListener('click', () => resolveMatch(choice));
}
dialog.addEventListener('cancel', () => { pending = undefined; });
window.addEventListener('storage', event => {
  if (event.key === storageKey || event.key === legacyKey || event.key === null) refresh();
});
document.getElementById('rename-cancel').addEventListener('click', () => renameDialog.close());
document.getElementById('rename-form').addEventListener('submit', event => {
  event.preventDefault();
  try {
    const entries = readEntries();
    const index = entries.findIndex(entry => entry.id === editingId);
    if (index < 0) {
      renameError.textContent = 'This entry is no longer available.';
      return;
    }
    const previous = entries[index];
    entries[index] = {...previous, title: renameTitle.value.trim()};
    localStorage.setItem(storageKey, JSON.stringify(entries));
    if (editingEntry?.id === editingId && editingEntry.title === previous.title && editingEntry.text === previous.text) {
      if (entryTitle.value === (previous.title ?? '')) entryTitle.value = entries[index].title;
      editingEntry = entries[index];
    }
    renameDialog.close();
    render(entries);
    document.querySelectorAll('#entries .rename-entry')[entries.length - 1 - index]?.focus();
    report('Title updated.');
  } catch {
    renameError.textContent = 'Could not save the title. Your changes are still here.';
  }
});
refresh();
</script>
</body>
</html>
